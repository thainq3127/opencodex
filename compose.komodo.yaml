name: opencodex

services:
  hub:
    image: ghcr.io/thainq3127/opencodex:latest
    init: true
    read_only: true
    environment:
      OPENCODEX_ADMIN_AUTH_TOKEN: ${OPENCODEX_ADMIN_AUTH_TOKEN:-}
    ports:
      - "10100:10100"
    volumes:
      - ocx-state:/home/bun/.opencodex
      - codex-state:/home/bun/.codex
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    stop_grace_period: 30s

volumes:
  ocx-state:
  codex-state:
